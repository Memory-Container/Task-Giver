<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Giver | Group</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../../shared/css/utils.css">
    <link rel="stylesheet" href="../../shared/css/modal.css">
    <link rel="stylesheet" href="group.css">
</head>
<body>
    <header></header>
    <main>
        <section class="taskbar-section">
            <div class="taskbar">
                <div class="search-box">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input class="search-bar" placeholder="Tìm kiếm nhóm...">
                </div>
                <button class="secondary" onclick="openGroupModal()">Thêm nhóm</button>
            </div>
        </section>
        <section class="group-section">
            <div class="group-container container">
                <div class="group">
                    <div class="group-banner">

                    </div>
                    <div class="group-content">
                        <div class="group-main">
                            <div class="group-header">
                                <div class="group-icon">
        
                                </div>
                                <h3 class="group-name">
                                    Farland Superlunary
                                </h3>
                            </div>
                            <div class="group-body">
                                <div class="group-desc">
                                    Nhóm giao việc của guild Farland Superlunary
                                </div>
                            </div>
                        </div>
                        <div class="group-footer">
                            <div class="small-info">
                                5 thành viên
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
<script src="../../shared/js/layout.js"></script>
<script src="../../shared/js/modal.js"></script>
<script src="group.js"></script>
</html>
